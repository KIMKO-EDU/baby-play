<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff3e2">
<title>아기 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 다정하고 말랑한 그림책, 글자 없이도 통하는 놀이판
   IDEA: 손때 묻은 헝겊 비지북과 원목 장난감 상자
   PICTURE: 굵은 선의 동물 친구들(소·강아지·고양이·오리·상어)이 모든 화면의 주인공
   COLOUR and TYPE: 크림 바탕, 과일색 파스텔 면, 진한 초콜릿 선 / Jua
   LAYOUT: 태블릿 가로 기준 큰 타일, 한 화면 한 놀이, 왼쪽 위 길게 누르는 집 버튼 */
:root{color-scheme:light;--bg:#fff3e2;--ink:#3a2e2a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
svg{display:block}
button{font:inherit;color:inherit;cursor:pointer;touch-action:none}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:block}

/* 메뉴 */
#menu{padding:3vmin 4vmin 2vmin;flex-direction:column;background:radial-gradient(circle at 20% 0%,#fff 0,transparent 45%),var(--bg)}
#menu.on{display:flex}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:2vmin;min-height:11vmin}
.mtop h1{margin:0;font-size:clamp(28px,6vmin,56px);font-weight:400;line-height:1.05;display:flex;align-items:center;gap:1.5vmin}
.mtop h1 svg{width:9vmin;height:9vmin}
.mbtn{border:0;background:#fff;border-radius:99px;padding:1.4vmin 2.8vmin;min-height:44px;font-size:clamp(14px,2.4vmin,20px);box-shadow:0 .5vmin 0 #0000001a}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:3vmin;padding:2vmin 0}
.tile{border:0;border-radius:5vmin;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;box-shadow:inset 0 -1.4vmin 0 #00000014;transition:transform .15s;padding:2vmin}
.tile:active{transform:scale(.93)}
.tile .ic{width:58%;max-width:26vmin;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:100%;height:100%}
.tile .lb{font-size:clamp(14px,3vmin,26px);opacity:.8}
.hint{font-size:clamp(13px,2.1vmin,18px);opacity:.55;text-align:center}
@media (orientation:portrait){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}.tile .ic{width:48%}}

/* 놀이 무대 + 집 버튼 */
#act{position:absolute;inset:0;overflow:hidden}
.r{position:absolute;inset:0;overflow:hidden}
#home{position:absolute;left:2vmin;top:2vmin;z-index:40;width:11vmin;height:11vmin;min-width:52px;min-height:52px;border-radius:50%;border:0;background:#ffffffd9;display:flex;align-items:center;justify-content:center;box-shadow:0 .6vmin 0 #0000001f;overflow:hidden;padding:0}
#home::before{content:"";position:absolute;inset:0;background:conic-gradient(#ffb703 calc(var(--p,0)*1turn),transparent 0)}
#home svg{position:relative;width:60%;height:60%}
#toast{position:fixed;left:15vmin;top:4vmin;z-index:41;background:#3a2e2ae6;color:#fff;padding:1.2vmin 2.4vmin;border-radius:99px;font-size:clamp(14px,2.4vmin,20px);opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
.pt{position:fixed;pointer-events:none;z-index:60;line-height:1}

@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-10deg) scale(1.12)}40%{transform:rotate(9deg) scale(1.12)}60%{transform:rotate(-6deg) scale(1.07)}80%{transform:rotate(4deg) scale(1.03)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-30%) scale(1.06)}70%{transform:translateY(0) scale(1.05,.94)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5%) rotate(2deg)}}
@keyframes popin{0%{transform:scale(.2)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-30vmin)}to{transform:translateX(calc(100vw + 5vmin))}}
.wiggle{animation:wiggle .7s ease}
.hop{animation:hop .55s ease}
.pop-in{animation:popin .45s cubic-bezier(.3,1.5,.5,1)}

/* 1 색칠 */
.a-color{display:flex;align-items:center;gap:3vmin;padding:3vmin;background:#fdebd8}
.a-color .pal{display:grid;grid-template-columns:repeat(2,9.5vmin);gap:2vmin;padding-top:12vmin;align-content:center}
.sw{width:9.5vmin;height:9.5vmin;border-radius:50%;border:.6vmin solid #fff;box-shadow:0 .6vmin 0 #00000026;transition:transform .15s;padding:0}
.sw.sel{transform:scale(1.18);outline:.7vmin solid var(--ink);outline-offset:.3vmin}
.board{flex:1;align-self:stretch;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:5vmin;box-shadow:inset 0 -1vmin 0 #0000000d;padding:2vmin}
.board svg{width:min(86vmin,100%);height:auto;max-height:100%}
.board .p{transition:fill .25s}
.a-color .pick{display:flex;flex-direction:column;gap:1.6vmin}
.pk{width:12vmin;height:12vmin;border-radius:3vmin;border:0;background:#fff;padding:1vmin;box-shadow:0 .5vmin 0 #0000001a}
.pk svg{width:100%;height:100%}
.pk.sel{outline:.7vmin solid #ffb703}
.pk.star{background:#ffd84d}
@media (orientation:portrait){.a-color{flex-direction:column;padding-top:15vmin}.a-color .pal{grid-template-columns:repeat(9,7.5vmin);padding:0}.sw{width:7.5vmin;height:7.5vmin}.a-color .pick{flex-direction:row}.board{width:100%}}

/* 2 조작 놀이판 */
.a-busy{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:2.5vmin;padding:2.5vmin 2.5vmin 2.5vmin 15vmin;background:#efdcbc}
.pn{border-radius:4vmin;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 -1.2vmin 0 #00000014}
.door-pn{background:#bfe3c0}
.dframe{position:relative;width:62%;height:84%;perspective:80vmin;background:#fff8e1;border:.8vmin solid var(--ink);border-radius:3vmin}
.dframe .behind{position:absolute;inset:8%;display:flex;align-items:center;justify-content:center}
.dframe .behind svg{width:100%}
.door{position:absolute;inset:-.8vmin;background:#d08a55;border:.8vmin solid var(--ink);border-radius:3vmin;transform-origin:left center;transition:transform .7s cubic-bezier(.3,1.3,.5,1);display:flex;flex-direction:column;gap:7%;padding:14% 16%}
.door i{flex:1;border:.6vmin solid #00000030;border-radius:1.5vmin}
.door b{position:absolute;right:10%;top:50%;width:5vmin;height:5vmin;border-radius:50%;background:#ffd84d;border:.6vmin solid var(--ink);transform:translateY(-50%)}
.door.open{transform:rotateY(-112deg)}
.light-pn{background:#3d4a6b;gap:8%;transition:background .3s}
.light-pn.on{background:#fff1b8}
.bulb{width:34%;transition:filter .3s}
.bulb .glass{transition:fill .3s}
.light-pn.on .glass{fill:#ffe066}
.light-pn.on .bulb{filter:drop-shadow(0 0 3vmin #ffd84d)}
.plate{width:15%;height:46%;background:#fff;border:.7vmin solid var(--ink);border-radius:2vmin;position:relative}
.plate::after{content:"";position:absolute;left:16%;right:16%;height:40%;top:52%;background:#ff9f1c;border:.6vmin solid var(--ink);border-radius:1.2vmin;transition:top .18s}
.light-pn.on .plate::after{top:8%}
.zip-pn{background:#ffd6d6}
.pocket{position:relative;width:62%;height:84%;background:#fff8e1;border:.8vmin solid var(--ink);border-radius:3vmin;overflow:hidden}
.pocket .inside{position:absolute;inset:6%;display:flex;align-items:flex-start;justify-content:center}
.pocket .inside svg{width:100%}
.cover{position:absolute;left:0;right:0;bottom:0;top:3%;background:#5ab0ff}
.cover::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2.4vmin;transform:translateX(-50%);background:repeating-linear-gradient(0deg,#eee 0 1vmin,#9aa5b1 1vmin 2vmin)}
.pull{position:absolute;left:50%;top:3%;width:6vmin;height:10vmin;transform:translate(-50%,-20%);background:#ffd84d;border:.7vmin solid var(--ink);border-radius:2vmin 2vmin 3vmin 3vmin;z-index:2}
.btn-pn{background:#cfe8ff;gap:6%}
.bb{width:23%;aspect-ratio:1;border-radius:50%;background:var(--c);border:.8vmin solid var(--ink);box-shadow:0 1.4vmin 0 var(--ink);transform:translateY(-.7vmin);transition:transform .08s,box-shadow .08s;padding:0}
.bb.down{transform:translateY(.7vmin);box-shadow:0 0 0 var(--ink)}
.wheel-pn{background:#e3d9ff}
.wheel{width:34vmin;height:34vmin;max-width:86%;max-height:86%}
.wheel svg{width:100%;height:100%}
.slide-pn{background:#d4f4dd}
.track{position:relative;width:74%;height:5vmin;border-radius:99px;background:linear-gradient(90deg,#8cc8ff,#3d8fd6);border:.7vmin solid var(--ink);margin-top:8vmin}
.track .knob{position:absolute;top:50%;left:0;width:15vmin;transform:translate(-50%,-80%)}
@media (orientation:portrait){.a-busy{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));padding:15vmin 2.5vmin 2.5vmin}}

/* 3 동물 소리 */
.a-sounds{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:4vmin 3vmin;padding:12vmin 4vmin 4vmin;background:radial-gradient(circle at 50% 45%,#fffbe8,#ffe2a8)}
.snd{position:relative;width:min(27vmin,17vw)}
.snd svg{width:100%}
.bub{position:absolute;left:50%;top:-8vmin;transform:translateX(-50%) scale(0);background:#fff;border:.6vmin solid var(--ink);border-radius:99px;padding:.6vmin 2.6vmin;font-size:clamp(18px,4.6vmin,44px);z-index:3;transition:transform .3s cubic-bezier(.3,1.6,.5,1);white-space:nowrap;pointer-events:none}
.snd.talk .bub,.slot.open .bub{transform:translateX(-50%) scale(1)}

/* 4 풍선 */
.a-balloon{background:linear-gradient(#8fd3ff,#d8f1ff 70%,#f4fbff)}
.cloud{position:absolute;left:0;width:24vmin;opacity:.9;animation:drift linear infinite;pointer-events:none}
.bal{position:absolute;left:0;top:0;will-change:transform}
.bal svg{width:100%;height:auto}
.bal .face{position:absolute;left:19%;top:10%;width:62%;pointer-events:none}
.drop{position:absolute;width:22vmin;margin:-11vmin 0 0 -11vmin;pointer-events:none}

/* 5 모양 맞추기 */
.a-shapes{display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;background:#e4f2ff;padding:4vmin}
.sbox{display:flex;gap:4vmin;padding:4vmin 5vmin;background:#d9a066;border:.9vmin solid var(--ink);border-radius:5vmin;box-shadow:inset 0 -1.6vmin 0 #00000026}
.hole{position:relative;width:20vmin;height:20vmin}
.hole>svg{width:100%;height:100%}
.stray{display:flex;gap:6vmin}
.tslot{width:20vmin;height:20vmin}
.piece{width:100%;height:100%}
.piece svg{width:100%;height:100%;filter:drop-shadow(0 1vmin 0 #0000002e)}
.hole .piece{position:absolute;inset:0}
.hole .piece svg{filter:none}
@media (orientation:portrait){.sbox,.stray{display:grid;grid-template-columns:repeat(2,20vmin)}}

/* 6 농장 */
.a-farm .scene{position:absolute;inset:0 0 19vmin 0;background:linear-gradient(#a8dcff 0 52%,#8fd46f 52% 100%);overflow:hidden}
.barn{position:absolute;left:9%;top:20%;width:26vmin}
.sun{position:absolute;right:7%;top:5%;width:17vmin;animation:spin 24s linear infinite}
.pond{position:absolute;right:7%;bottom:9%;width:44vmin;height:16vmin;border-radius:50%;background:radial-gradient(#9fd2ff,#4ea4ec);border:.7vmin solid #3d8fd6}
.flower{position:absolute;width:5vmin}
.ftray{position:absolute;left:0;right:0;bottom:0;height:19vmin;background:#fff6e0;border-top:.8vmin solid #e2c799;display:flex;align-items:center;justify-content:center;gap:3vmin}
.ft{width:15vmin;height:15vmin;border:0;background:none;padding:0}
.ft svg{width:100%;height:100%}
.fa{position:absolute;width:15vmin;height:15vmin;margin:-7.5vmin 0 0 -7.5vmin;z-index:5}
.fa svg{width:100%;height:100%;animation:bob 2.6s ease-in-out infinite}

/* 7 반짝반짝 */
.a-spark{background:#1b1f3b}
.a-spark canvas{display:block}

/* 8 까꿍 */
.a-peek{display:flex;align-items:center;justify-content:center;gap:5vmin;background:linear-gradient(#e6f4ff 0 72%,#c9e7b8 72%);padding-top:10vmin}
.slot{position:relative;width:min(30vmin,28vw);height:40vmin}
.critter{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6%}
.critter svg{width:100%;transform:scale(.5) translateY(20%);opacity:0;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.slot.open .critter svg{transform:none;opacity:1}
.blanket{position:absolute;inset:0;border:.8vmin solid var(--ink);border-radius:9vmin 9vmin 3vmin 3vmin;transition:transform .5s cubic-bezier(.3,1.2,.5,1);transform-origin:50% 100%;z-index:2;box-shadow:0 1vmin 0 #0000001f}
.slot.open .blanket{transform:scaleY(.16)}
</style>
</head>
<body>
<div id="menu" class="screen on">
  <div class="mtop"><h1 id="logo">아기 놀이터</h1><button class="mbtn" id="fs">전체 화면</button></div>
  <div class="grid" id="grid"></div>
  <div class="hint">부모님께: 놀이 중에는 왼쪽 위 집 버튼을 길게 누르면 이 화면으로 돌아와요.</div>
</div>
<div id="stage" class="screen">
  <div id="act"></div>
  <button id="home" aria-label="처음으로 (길게 누르기)"></button>
</div>
<div id="toast">길게 누르면 처음 화면으로 가요</div>

<script>
{
const INK='#3a2e2a';
const S=`stroke="${INK}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"`;
const S4=`stroke="${INK}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"`;
const EYE=(x,y,r=7)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/><circle cx="${x+2.5}" cy="${y-2.5}" r="${r*.32}" fill="#fff"/>`;
const CHEEK=(x,y,o)=>o?'':`<ellipse cx="${x}" cy="${y}" rx="9" ry="6" fill="#ff8fa3" opacity=".5"/>`;

/* ---------- 동물 그림 ---------- */
const ANIMALS={
 cow:{say:'음메~',draw:(F,o)=>`
  <path d="M62 58 C52 40 54 26 66 20 C66 34 72 46 80 52 Z" fill="${F('#f3e3b5')}" ${S}/>
  <path d="M138 58 C148 40 146 26 134 20 C134 34 128 46 120 52 Z" fill="${F('#f3e3b5')}" ${S}/>
  <ellipse cx="40" cy="80" rx="26" ry="13" transform="rotate(-25 40 80)" fill="${F('#ffffff')}" ${S}/>
  <ellipse cx="160" cy="80" rx="26" ry="13" transform="rotate(25 160 80)" fill="${F('#ffffff')}" ${S}/>
  <ellipse cx="100" cy="102" rx="56" ry="58" fill="${F('#ffffff')}" ${S}/>
  <path d="M58 82 Q62 56 88 60 Q98 78 80 86 Q64 92 58 82Z" fill="${F(INK)}" ${S4}/>
  <path d="M122 68 Q140 64 146 84 Q132 92 122 80Z" fill="${F(INK)}" ${S4}/>
  ${EYE(80,98)}${EYE(120,98)}
  <ellipse cx="100" cy="136" rx="40" ry="25" fill="${F('#f7b5c4')}" ${S}/>
  <ellipse cx="86" cy="136" rx="5" ry="7" fill="${INK}"/><ellipse cx="114" cy="136" rx="5" ry="7" fill="${INK}"/>`},
 dog:{say:'멍멍!',draw:(F,o)=>`
  <ellipse cx="100" cy="104" rx="56" ry="54" fill="${F('#e8b77d')}" ${S}/>
  <path d="M58 64 C30 60 20 112 34 136 C48 144 60 116 66 84 Z" fill="${F('#8b5a3c')}" ${S}/>
  <path d="M142 64 C170 60 180 112 166 136 C152 144 140 116 134 84 Z" fill="${F('#8b5a3c')}" ${S}/>
  ${EYE(82,96)}${EYE(118,96)}
  ${CHEEK(74,120,o)}${CHEEK(126,120,o)}
  <ellipse cx="100" cy="132" rx="32" ry="23" fill="${F('#fff3e0')}" ${S}/>
  <path d="M93 139 q7 16 14 0z" fill="${F('#f48fa0')}" ${S4}/>
  <ellipse cx="100" cy="120" rx="12" ry="8" fill="${INK}"/>
  <path d="M100 127 v8 M100 135 q-8 8 -15 1 M100 135 q8 8 15 1" fill="none" ${S4}/>`},
 cat:{say:'야옹~',draw:(F,o)=>`
  <path d="M48 86 L50 26 L96 60 Z" fill="${F('#f4a259')}" ${S}/>
  <path d="M152 86 L150 26 L104 60 Z" fill="${F('#f4a259')}" ${S}/>
  <path d="M58 66 L59 44 L78 58 Z" fill="${F('#f7b5c4')}" ${S4}/>
  <path d="M142 66 L141 44 L122 58 Z" fill="${F('#f7b5c4')}" ${S4}/>
  <ellipse cx="100" cy="110" rx="62" ry="52" fill="${F('#f4a259')}" ${S}/>
  <path d="M100 62 v14 M86 64 l4 11 M114 64 l-4 11" fill="none" ${S4}/>
  ${EYE(78,104,8)}${EYE(122,104,8)}
  ${CHEEK(68,126,o)}${CHEEK(132,126,o)}
  <path d="M93 120 h14 l-7 8z" fill="${F('#f48fa0')}" ${S4}/>
  <path d="M100 128 q-7 9 -14 3 M100 128 q7 9 14 3" fill="none" ${S4}/>
  <path d="M66 124 h-32 M66 134 l-30 7 M134 124 h32 M134 134 l30 7" fill="none" ${S4}/>`},
 duck:{say:'꽥꽥!',draw:(F,o)=>`
  <path d="M160 128 L188 108 L178 146 Z" fill="${F('#ffd84d')}" ${S}/>
  <ellipse cx="112" cy="142" rx="64" ry="38" fill="${F('#ffd84d')}" ${S}/>
  <path d="M104 134 C124 118 156 124 160 142 C142 156 118 152 104 134Z" fill="${F('#f5c518')}" ${S4}/>
  <circle cx="72" cy="80" r="40" fill="${F('#ffd84d')}" ${S}/>
  <path d="M70 42 C66 30 74 24 80 30 C80 22 90 24 88 38" fill="none" ${S4}/>
  <path d="M36 82 C14 78 10 98 28 102 C40 104 48 98 46 90 Z" fill="${F('#ff9f1c')}" ${S}/>
  ${EYE(76,74)}${CHEEK(90,94,o)}`},
 shark:{say:'첨벙첨벙!',draw:(F,o)=>`
  <path d="M84 76 L102 32 L126 80 Z" fill="${F('#6fa8dc')}" ${S}/>
  <path d="M150 100 L186 70 C180 94 180 112 188 138 L150 116 Z" fill="${F('#6fa8dc')}" ${S}/>
  <path d="M20 110 C34 70 110 60 158 96 C162 102 162 112 156 118 C110 150 36 148 20 110 Z" fill="${F('#6fa8dc')}" ${S}/>
  <path d="M28 116 C60 136 120 138 150 118 C110 132 64 130 28 116 Z" fill="${F('#ffffff')}" ${S4}/>
  <path d="M86 128 L76 158 L108 132 Z" fill="${F('#6fa8dc')}" ${S}/>
  ${EYE(56,96)}${CHEEK(66,112,o)}
  <path d="M30 112 q16 12 34 4" fill="none" ${S4}/>
  <path d="M100 92 q-5 10 0 20 M112 92 q-5 10 0 20" fill="none" ${S4}/>`}
};
const KEYS=Object.keys(ANIMALS);
const animalSVG=(k,outline=false,cls='')=>{const F=outline?(()=>'#ffffff" class="p'):(c=>c);return `<svg class="${cls}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${ANIMALS[k].draw(F,outline)}</svg>`};

/* ---------- 도우미 ---------- */
const $=(t,cls,parent,html)=>{const e=document.createElement(t);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e};
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const COLORS=['#ff5d5d','#ff9f1c','#ffd84d','#7bd389','#5ab0ff','#b28dff','#ff8fc8'];
const TIMERS=new Set();
const later=(fn,ms)=>{const id=setTimeout(()=>{TIMERS.delete(id);fn()},ms);TIMERS.add(id);return id};
function dragging(e,onMove,onEnd){
  const id=e.pointerId;
  const mv=ev=>{if(ev.pointerId===id)onMove(ev)};
  const up=ev=>{if(ev.pointerId!==id)return;removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);onEnd&&onEnd(ev)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}

  const scene=root.querySelector('.scene'),tray=root.querySelector('.ftray');
  [[30,8,6],[55,62,40],[70,20,5]].forEach(([x,y,d],i)=>{const c=$('div','cloud',scene,cloudSVG);c.style.top=x/6+'%';c.style.animationDuration=y+'s';c.style.animationDelay=-(i*20)+'s'});
  [[22,70],[40,85],[55,64],[8,88],[48,74]].forEach(([x,y],i)=>{const f=$('div','flower',scene,flowerSVG(['#ff8fc8','#fff','#b28dff'][i%3]));f.style.left=x+'%';f.style.top=y+'%'});
  const placed=[];
  function hopSpeak(el,k){el.classList.remove('hop');void el.offsetWidth;el.classList.add('hop');speak(k)}
  function place(el,x,y){const r=scene.getBoundingClientRect();el.style.left=(x-r.left)+'px';el.style.top=(y-r.top)+'px'}
  function drag(e,el,k,isNew){let sx=e.clientX,sy=e.clientY,moved=isNew?99:0;el.style.zIndex=20;
    dragging(e,ev=>{moved=Math.max(moved,Math.hypot(ev.clientX-sx,ev.clientY-sy));place(el,ev.clientX,ev.clientY)},ev=>{el.style.zIndex=5+Math.round(ev.clientY/20);
      const sr=scene.getBoundingClientRect();
      if(ev.clientY>sr.bottom){burst(ev.clientX,ev.clientY,{n:10,colors:['#fff','#e2c799'],spread:60});SFX.whoosh();el.remove();placed.splice(placed.indexOf(el),1);return}
      if(moved<10||isNew)hopSpeak(el,k);else SFX.boing()})}
  KEYS.forEach(k=>{const b=$('button','ft',tray,animalSVG(k));b.setAttribute('aria-label',k);
    b.onpointerdown=e=>{const el=$('div','fa',scene,animalSVG(k));el.firstChild.style.animationDelay=-rand(0,2.6)+'s';place(el,e.clientX,e.clientY);placed.push(el);SFX.tick();
      if(placed.length>14){const old=placed.shift();old.remove()}
      el.onpointerdown=ev=>drag(ev,el,k,false);drag(e,el,k,true)}});
}

/* ---------- 7. 반짝반짝 ---------- */
function actSpark(root){
  root.classList.add('a-spark');
  const cv=$('canvas','',root),ctx=cv.getContext('2d');let W,H,raf,hue=0,lastNote=0;const P=[];
  const bg=[...Array(70)].map(()=>({x:Math.random(),y:Math.random(),r:rand(.6,2),t:rand(0,6)}));
  function size(){const d=Math.min(2,devicePixelRatio||1);W=root.clientWidth;H=root.clientHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);
  function spawn(x,y,n,sp){for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(.5,sp);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.5,life:1,dec:rand(.008,.02),h:(hue+rand(-20,20)+360)%360,r:rand(4,11),star:Math.random()<.55,rot:rand(0,6)})}hue=(hue+3)%360;if(P.length>900)P.splice(0,P.length-900)}
  function star(x,y,r,rot){ctx.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=rot+i*Math.PI/5;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
  function note(y){const now=performance.now();if(now-lastNote<110)return;lastNote=now;const i=Math.floor((1-y/H)*PENTA.length);const f=PENTA[Math.max(0,Math.min(PENTA.length-1,i))]*2;tone({f,t:.6,v:.12});tone({type:'triangle',f:f/2,t:.4,v:.05})}
  function loop(t){ctx.globalCompositeOperation='source-over';ctx.fillStyle='#1b1f3b';ctx.fillRect(0,0,W,H);
    for(const s of bg){ctx.fillStyle=`rgba(255,255,255,${.35+.35*Math.sin(t/700+s.t)})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill()}
    ctx.globalCompositeOperation='lighter';
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.vx*=.99;p.life-=p.dec;p.rot+=.05;if(p.life<=0){P.splice(i,1);continue}
      ctx.fillStyle=`hsla(${p.h},100%,65%,${p.life})`;if(p.star)star(p.x,p.y,p.r*p.life+2,p.rot);else{ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life+1,0,6.283);ctx.fill()}}
    raf=requestAnimationFrame(loop)}
  raf=requestAnimationFrame(loop);
  root.onpointerdown=e=>{spawn(e.clientX,e.clientY,30,5);note(e.clientY);dragging(e,ev=>{spawn(ev.clientX,ev.clientY,4,2.2);note(ev.clientY)})};
  return ()=>{cancelAnimationFrame(raf);removeEventListener('resize',size)};
}

/* ---------- 8. 까꿍 놀이 ---------- */
function actPeek(root){
  root.classList.add('a-peek');
  const BL=['radial-gradient(circle,#ffffff99 22%,transparent 24%) 0 0/7vmin 7vmin,#ff8fc8','repeating-linear-gradient(45deg,#5ab0ff 0 3vmin,#8cc8ff 3vmin 6vmin)','repeating-conic-gradient(#ffd84d 0 25%,#ffe98f 0 50%) 0 0/8vmin 8vmin'];
  BL.forEach(bg=>{const s=$('div','slot',root,'<div class="critter"></div><div class="bub">까꿍!</div><div class="blanket"></div>');s.querySelector('.blanket').style.background=bg;
    const cr=s.querySelector('.critter');let k=pick(KEYS);cr.innerHTML=animalSVG(k);
    s.onpointerdown=()=>{if(s.classList.contains('open'))return;s.classList.add('open');SFX.whoosh();say('까꿍!');later(()=>VOICE[k](),700);
      const r=s.getBoundingClientRect();later(()=>burst(r.left+r.width/2,r.top+r.height*.4,{n:12,emoji:['✨','⭐'],size:16,spread:150}),200);
      later(()=>{s.classList.remove('open');later(()=>{k=pick(KEYS);cr.innerHTML=animalSVG(k)},500)},2800)}});
}

/* ---------- 메뉴와 이동 ---------- */
const doorIcon=`<svg viewBox="0 0 100 100"><rect x="22" y="10" width="56" height="82" rx="8" fill="#d08a55" ${S}/><rect x="32" y="22" width="36" height="26" rx="4" fill="none" stroke="#00000030" stroke-width="4"/><rect x="32" y="56" width="36" height="26" rx="4" fill="none" stroke="#00000030" stroke-width="4"/><circle cx="66" cy="52" r="6" fill="#ffd84d" ${S4}/></svg>`;
const sparkIcon=`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#1b1f3b"/><g transform="translate(50 50)">${shapeSVG('star','#ffd84d').replace('<svg viewBox="0 0 100 100">','<svg x="-28" y="-30" width="56" height="56" viewBox="0 0 100 100">')}</g><circle cx="24" cy="30" r="4" fill="#ff8fc8"/><circle cx="76" cy="72" r="5" fill="#5ab0ff"/><circle cx="74" cy="26" r="3" fill="#fff"/></svg>`;
const peekIcon=`<svg viewBox="0 0 100 100"><svg x="10" y="6" width="80" height="80" viewBox="0 0 200 200">${ANIMALS.cat.draw(c=>c,false)}</svg><path d="M6 62 Q50 50 94 62 V94 H6Z" fill="#ff8fc8" ${S4}/><circle cx="28" cy="78" r="4" fill="#fff"/><circle cx="50" cy="72" r="4" fill="#fff"/><circle cx="72" cy="80" r="4" fill="#fff"/></svg>`;
const shapesIcon=`<svg viewBox="0 0 100 100"><svg x="2" y="2" width="46" height="46" viewBox="0 0 100 100"><g fill="#ff5d5d" ${S}>${SHAPES.circle}</g></svg><svg x="52" y="2" width="46" height="46" viewBox="0 0 100 100"><g fill="#5ab0ff" ${S}>${SHAPES.square}</g></svg><svg x="2" y="52" width="46" height="46" viewBox="0 0 100 100"><g fill="#7bd389" ${S}>${SHAPES.tri}</g></svg><svg x="52" y="52" width="46" height="46" viewBox="0 0 100 100"><g fill="#ffd84d" ${S}>${SHAPES.star}</g></svg></svg>`;
const ACTS=[
  {lb:'색칠놀이',c:'#ffd6d6',ic:animalSVG('cow'),fn:actColor},
  {lb:'조작 놀이판',c:'#ffe6b8',ic:doorIcon,fn:actBusy},
  {lb:'동물 소리',c:'#fff3b0',ic:animalSVG('dog'),fn:actSounds},
  {lb:'풍선 터뜨리기',c:'#d4f4dd',ic:balloonSVG('#ff5d5d'),fn:actBalloon},
  {lb:'모양 맞추기',c:'#cfe8ff',ic:shapesIcon,fn:actShapes},
  {lb:'농장 꾸미기',c:'#e3d9ff',ic:barnSVG,fn:actFarm},
  {lb:'반짝반짝',c:'#ffd9ef',ic:sparkIcon,fn:actSpark},
  {lb:'까꿍 놀이',c:'#d9f2f2',ic:peekIcon,fn:actPeek}
];
const menu=document.getElementById('menu'),stage=document.getElementById('stage'),act=document.getElementById('act'),grid=document.getElementById('grid'),home=document.getElementById('home'),toast=document.getElementById('toast');
document.getElementById('logo').insertAdjacentHTML('afterbegin',animalSVG('duck'));
home.innerHTML=houseSVG;
grid.innerHTML=ACTS.map((a,i)=>`<button class="tile" data-i="${i}" style="--c:${a.c}"><span class="ic">${a.ic}</span><span class="lb">${a.lb}</span></button>`).join('');
let cleanup=null,wake=null;
function open(i){ac();SFX.whoosh();menu.classList.remove('on');stage.classList.add('on');act.innerHTML='';const root=$('div','r',act);cleanup=ACTS[i].fn(root)||null;
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}
function goMenu(){if(cleanup)cleanup();cleanup=null;TIMERS.forEach(clearTimeout);TIMERS.clear();try{speechSynthesis.cancel()}catch(e){}act.innerHTML='';stage.classList.remove('on');menu.classList.add('on');SFX.whoosh()}
grid.addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)open(+t.dataset.i)});
let hold=0,toastT;
home.addEventListener('pointerdown',e=>{e.stopPropagation();const t0=performance.now();
  const step=()=>{const p=Math.min(1,(performance.now()-t0)/1200);home.style.setProperty('--p',p);if(p>=1){hold=0;home.style.setProperty('--p',0);goMenu();return}hold=requestAnimationFrame(step)};hold=requestAnimationFrame(step)});
const stopHold=()=>{if(!hold)return;cancelAnimationFrame(hold);hold=0;home.style.setProperty('--p',0);toast.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('on'),1800)};
['pointerup','pointerleave','pointercancel'].forEach(ev=>home.addEventListener(ev,stopHold));
document.getElementById('fs').addEventListener('click',()=>{try{const el=document.documentElement;const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);r&&r.then&&r.then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{})}catch(e){}});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('pointerdown',()=>ac(),{once:true});
try{speechSynthesis.getVoices()}catch(e){}
}
